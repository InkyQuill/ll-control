[package]
name = "llcontrol-profile"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors = ["Pavel Obruchnikov <me@inkyquill.net>"]

[dependencies]
llcontrol-ipc = { path = "../llcontrol-ipc" }
llcontrol-media = { path = "../llcontrol-media" }
anyhow.workspace = true
tempfile = "3"
llcontrol-image = { path = "../llcontrol-image" }
base64 = "0.22.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
# ZIP9 requires Rust 1.88; only the .NET export codec is enabled.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }

# Select the same miniz Rust backend already used by image/PNG, also standalone.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
llcontrol-media = { path = "../llcontrol-media", features = ["test-support"] }
