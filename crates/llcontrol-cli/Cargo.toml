[package]
name = "llcontrol-cli"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "llcontrol"
path = "src/main.rs"

[dependencies]
rand = "0.8"
tempfile = "3"
llcontrol-ipc   = { path = "../llcontrol-ipc" }
llcontrol-image = { path = "../llcontrol-image" }
llcontrol-media = { path = "../llcontrol-media" }
llcontrol-profile = { path = "../llcontrol-profile" }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "io-std", "time"] }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
xdg = "2"

[dev-dependencies]
base64 = "0.22.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
llcontrol-daemon = { path = "../llcontrol-daemon" }
llcontrol-hid = { path = "../llcontrol-hid" }
llcontrol-protocol = { path = "../protocol" }
