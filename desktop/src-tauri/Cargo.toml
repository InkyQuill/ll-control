[package]
name = "llcontrol-gui"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.4.2"
llcontrol-media = { path = "../../crates/llcontrol-media" }
llcontrol-profile = { path = "../../crates/llcontrol-profile" }
llcontrol-ipc = { path = "../../crates/llcontrol-ipc" }
llcontrol-image = { path = "../../crates/llcontrol-image" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "net", "io-util", "rt"] }

tempfile = "3"
anyhow.workspace = true
httparse = "1"
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }
futures-util = "0.3"
url = "2"
libc = "0.2"
sha2 = "0.10.9"
rustix = { version = "=1.1.6", features = ["fs"] }
gstreamer = "0.21"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2"] }
llcontrol-media = { path = "../../crates/llcontrol-media", features = ["test-support"] }
llcontrol-daemon = { path = "../../crates/llcontrol-daemon" }
llcontrol-hid = { path = "../../crates/llcontrol-hid" }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
