name: Verify CI fixture isolation
on:
  push:
    branches: ['verify/zip9-profile-tests']
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 25
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - run: pacman -Syu --noconfirm --needed git rustup python pkgconf hidapi systemd ffmpeg fontconfig
      - run: rustup default 1.96.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cargo test --locked -p lconnect-daemon --lib windows_screen_preview_cancel_and_stale_finish_leave_target_catalog_and_settings_unchanged
      - run: cargo test --locked -p lconnect-daemon --test composition_ipc
