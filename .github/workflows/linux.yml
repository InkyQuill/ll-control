name: Verify dedup against merged PR
on: push
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Query the actual merged PR and green jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=.github/scripts python3 - <<'PY'
          import os
          from ci_dedup import should_skip, api_get
          merge = 'a688fc6339b8b6a97e1816b614623ddd1bc1577d'
          tree = '6a735691a528f921cbef0c0cd012ac7f622a429e'
          event = dict(os.environ, GITHUB_EVENT_NAME='push', GITHUB_REF='refs/heads/master', GITHUB_SHA=merge)
          assert should_skip(event, tree, api_get)
          assert not should_skip(event, 'f' * 40, api_get)
          print('Exact PR 32 merge tree: skip arch and browser. Different tree: run both.')
          PY
