name: Focused profile tests
on: push
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo +1.96.0 test --locked -p lconnect-profile
