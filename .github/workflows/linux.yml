name: Diagnose the merged Arch checks
on: push
permissions:
  contents: read
  checks: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read annotations on the failed Arch job
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/InkyQuill/lconnect-linux/check-runs/131426472183/annotations --jq '.[] | {title,message,path}'
