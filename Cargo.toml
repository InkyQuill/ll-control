[workspace]
resolver = "2"
members = [
    "desktop/src-tauri",
    "crates/lconnect-cli",
    "crates/lconnect-daemon",
    "crates/lconnect-hid",
    "crates/lconnect-image",
    "crates/lconnect-intel-memory",
    "crates/lconnect-ipc",
    "crates/lconnect-profile",
    "crates/lconnect-media",
    "crates/protocol",
    "tools/verify-galahad",
    "xtask",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.82"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/inky/lconnect-linux"
authors      = ["LL-Control contributors"]

[workspace.dependencies]
# Used by `protocol`, `lconnect-hid`
thiserror  = "1"
tracing    = "0.1"

# Used by `verify-galahad`
hidapi     = "2.5"
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }

# Used by `lconnect-ipc`
serde      = "1"
serde_json = "1"
tokio      = { version = "1", default-features = false }

[profile.release]
opt-level     = 3
lto           = true
strip         = true
codegen-units = 1
